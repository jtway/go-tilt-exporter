brewfather:
  # User ID from Brewfather
  user_id: "your_user_id"
  # API Key from Brewfather (or env TILT_EXPORTER_BREWFATHER_API_KEY)
  api_key: "your_api_key"
  # Frequency at which the Brewfather API will be queried for in-progress batches
  update_interval: 15m
  # Webhooks here show up as custom streams. When taking readings from a Tilt,
  # if there is a matching stream associated with a batch it will automatically update
  webhooks:
    - name: "brewtracker"
      url: "http://log.brewfather.net/stream?id=your_id"
      update_interval: 15m
      enabled: true
prom:
  # Prometheus port to expose metrics on
  port: 9100

# Where Tilt readings come from.
source:
  # "mqtt": subscribe to readings published by ESP32 tilt-receivers (esphome/).
  # "ble":  scan with this machine's Bluetooth adapter (the original mode).
  type: mqtt
  # How often readings are processed; in BLE mode also the scan duration.
  cycle_interval: 15s
  # Drop readings older than this (e.g. a retained message from a dead receiver).
  max_reading_age: 5m

mqtt:
  broker: tcp://192.168.1.241:1883
  username: brewtracker
  # Prefer the env var TILT_EXPORTER_MQTT_PASSWORD over putting it here.
  password: ""
  topic: brewery/tilt/v1/+
  # client_id defaults to go-tilt-exporter-<hostname>

tracing:
  enabled: true
  # OTLP/HTTP base URL (the in-cluster otel-gateway via the shared Gateway).
  # Standard OTEL_EXPORTER_OTLP_* env vars work too when this is empty.
  endpoint: https://otlp.lab.jtway.com
  service_name: go-tilt-exporter
  sample_ratio: 1.0
