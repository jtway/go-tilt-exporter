# go-tilt-exporter — one binary, three components that only meet via the broker:
#   batch-sync     Brewfather API -> brewery/batch/v1/<id> (retained)
#   brewtracker    Tilt readings x batch state -> batch metrics + Brewfather stream
#   device-metrics Tilt readings -> one series per Tilt (no batch needed)
# Any component can be switched off here and run as its own service later.
components:
  batch_sync: true
  brewtracker: true
  device_metrics: true

brewfather:
  # API credentials (used by batch-sync only). Prefer env:
  #   TILT_EXPORTER_BREWFATHER_USER_ID / TILT_EXPORTER_BREWFATHER_API_KEY
  user_id: "your_user_id"
  api_key: "your_api_key"
  # Custom streams. A batch posts to the webhook whose name matches a stream
  # attached to that batch in Brewfather. Brewfather accepts one post per 15
  # minutes per device name.
  webhooks:
    - name: "brewtracker"
      url: "http://log.brewfather.net/stream?id=your_id"
      update_interval: 15m
      enabled: true

batch_sync:
  # How often to poll Brewfather (each poll costs 1 call per status + 1 per
  # active batch; the API allows 500/hour).
  refresh_interval: 5m
  # Brewfather statuses treated as active. Status is set by hand in the app;
  # this only follows it.
  statuses: [Fermenting]
  # Also track Conditioning (e.g. watching temperature through a cold crash).
  track_conditioning: false
  mqtt_username: batch-sync
  # env TILT_EXPORTER_BATCH_SYNC_MQTT_PASSWORD

prom:
  port: 9100

source:
  # "mqtt": readings from ESP32 tilt-receivers (esphome/). "ble": scan with
  # this machine's Bluetooth adapter. Batch state always comes from the broker.
  type: mqtt
  cycle_interval: 15s
  # Readings older than this are ignored, and device series are removed.
  max_reading_age: 5m

mqtt:
  broker: tcp://192.168.1.241:1883
  # brewtracker and device-metrics read with this (read-only) user.
  username: brewtracker
  # env TILT_EXPORTER_MQTT_PASSWORD
  topic: brewery/tilt/v1/+
  topic_root: brewery

tracing:
  enabled: true
  endpoint: https://otlp.lab.jtway.com
  service_name: go-tilt-exporter
  sample_ratio: 1.0
